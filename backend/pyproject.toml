[project]
name = "files2md"
version = "0.1.0"
description = "Convierte PDFs, imágenes y documentos Office a Markdown/Word/PDF ordenado. 100% local."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pypdf>=4.2",
  "pillow>=10.2",
]

[project.optional-dependencies]
# Parser determinista para PDFs/Office digitales
parse = ["docling>=2.0"]
# Se completa al implementar el motor OCR elegido tras el benchmark
ocr = []
scale = ["redis>=5.0", "arq>=0.25"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
