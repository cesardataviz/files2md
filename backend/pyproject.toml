[project]
name = "files2md"
version = "0.1.0"
description = "Convierte PDFs, imágenes y documentos Office a Markdown/Word/PDF ordenado. 100% local."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pypdf>=4.2",
  "pillow>=10.2",
  "pypdfium2>=4.0",  # rasterizar PDFs para OCR (Apache-2.0/BSD)
  "mistune>=3.0",  # Markdown -> estructura para exportar (BSD-3)
  "python-docx>=1.1",  # exportar a Word (MIT)
  "typst>=0.12",  # exportar a PDF; incluye el compilador (Apache-2.0)
  "opencv-python-headless>=4.8",  # preprocesar fotos antes del OCR (Apache-2.0)
  "numpy>=1.26",
]

[project.optional-dependencies]
# Parser determinista para PDFs/Office digitales
parse = ["docling>=2.0"]
# El OCR usa el binario de Tesseract (se instala aparte, no por pip)
# Distancia de edición en C++: acelera las métricas en documentos largos
bench = ["rapidfuzz>=3.0"]
scale = ["redis>=5.0", "arq>=0.25"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.modules.parse" = ["templates/*.typ"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Errores reales (sintaxis, nombres indefinidos, imports sin usar) y orden de imports.
select = ["E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
